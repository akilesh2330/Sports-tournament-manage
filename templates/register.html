{% extends 'base.html' %}

{% block title %}Register Account - Arena Pulse{% endblock %}

{% block content %}
<div style="max-width: 460px; margin: 3rem auto;">
    <div class="card">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="width: 60px; height: 60px; background: rgba(16, 185, 129, 0.15); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; color: var(--accent-emerald); font-size: 1.8rem;">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h2 style="font-size: 1.6rem; color: #fff; font-weight: 800;">Create an Account</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.3rem;">Join to create teams and register for tournaments</p>
        </div>

        <form action="{{ url_for('register') }}" method="POST">
            <div class="form-group">
                <label class="form-label" for="name">Full Name</label>
                <input type="text" id="name" name="name" class="form-control" placeholder="e.g. Alex Morgan" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="alex@domain.com" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Choose a strong password" required>
            </div>

            <button type="submit" class="btn btn-success" style="width: 100%; justify-content: center; padding: 0.8rem; margin-top: 1rem;">
                <i class="fa-solid fa-check"></i> Register Account
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
            Already registered? <a href="{{ url_for('login') }}" style="font-weight: 600;">Log in here</a>
        </div>
    </div>
</div>
{% endblock %}
